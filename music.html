<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Μουσική Αθήνα</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#182338;
    --ink2:#233252;
    --paper:#F6F0E4;
    --coral:#C1524B;
    --coral-dim: rgba(193,82,75,0.18);
    --accent: var(--coral);
    --line: rgba(246,240,228,0.14);
    --muted: rgba(246,240,228,0.55);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--ink);color:var(--paper);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 60px;}

  .app-nav{display:flex;gap:6px;margin-bottom:18px;}
  .app-nav a, .app-nav span{flex:1;text-align:center;padding:8px 6px;border-radius:8px;font-size:12px;font-weight:600;text-decoration:none;color:var(--muted);background:var(--ink2);border:1px solid var(--line);}
  .app-nav a.active{background:var(--accent);color:var(--ink);border-color:var(--accent);}
  .app-nav span.disabled{opacity:.45;}
  .eyebrow{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);font-weight:600;}
  h1{font-family:'Fraunces',serif;font-weight:600;font-size:32px;line-height:1.05;margin:6px 0 4px;}
  .sub{font-size:13.5px;color:var(--muted);line-height:1.5;margin:0 0 16px;}

  input[type=text]{width:100%;padding:10px 13px;border-radius:8px;border:1px solid var(--line);background:var(--ink2);color:var(--paper);font-family:'Inter',sans-serif;font-size:14px;margin:4px 0 4px;}
  input[type=text]::placeholder{color:rgba(246,240,228,0.4);}
  input[type=text]:focus{outline:none;border-color:var(--coral);}

  .count{font-size:11.5px;color:var(--muted);margin:8px 2px 12px;}

  .month-header{font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--coral);text-transform:uppercase;letter-spacing:.04em;margin:20px 2px 8px;}
  .month-header:first-child{margin-top:0;}

  .event{background:var(--ink2);border-radius:10px;padding:14px 16px;margin-bottom:10px;border-left:3px solid var(--coral);}
  .e-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .e-date{font-family:'Fraunces',serif;font-size:14px;font-weight:600;color:var(--coral);white-space:nowrap;flex-shrink:0;min-width:44px;}
  .e-title{font-family:'Fraunces',serif;font-size:16px;font-weight:600;margin:0 0 3px;}
  .e-venue{font-size:12.5px;color:var(--muted);}
  .e-genres{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;}
  .genre-tag{font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--coral-dim);color:var(--coral);}
  .genre-tag-approx{font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:transparent;border:1px dashed rgba(193,82,75,0.5);color:var(--muted);}
  .e-source{font-size:10.5px;color:var(--muted);margin-top:6px;}
  .e-source a{color:var(--muted);}
  .e-unconfirmed{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:rgba(246,240,228,0.1);color:var(--muted);margin-top:6px;margin-right:6px;}
  .e-new{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:var(--coral);color:var(--ink);margin-top:6px;margin-right:6px;}

  .state{text-align:center;padding:50px 10px;color:var(--muted);font-size:13.5px;line-height:1.6;}
  footer{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.6;}
</style>
</head>
<body>
<div class="wrap">

<nav class="app-nav">
  <a href="index.html">Αρχική</a>
  <a href="cinema.html">Σινεμά</a>
  <a href="music.html" class="active">Μουσική</a>
  <span class="disabled">Θέατρο</span>
</nav>

<div class="eyebrow">Οδηγός Μουσικής</div>
<h1>Ζωντανή μουσική</h1>
<p class="sub">Συναυλίες στην Αττική, από το more.com, το ticketservices.gr και το rocking.gr.</p>

<input type="text" id="search" placeholder="Αναζήτηση καλλιτέχνη, χώρου ή είδους...">
<div class="count" id="count"></div>

<div id="results"><div class="state">Φόρτωση...</div></div>

<footer id="footer"></footer>

</div>

<script>
const MONTHS = ['Ιαν','Φεβ','Μαρ','Απρ','Μάι','Ιουν','Ιουλ','Αυγ','Σεπ','Οκτ','Νοε','Δεκ'];
const NEW_WINDOW_DAYS = 3; // how many days an event stays flagged "ΝΕΟ" after first appearing

// Normalized rows from BOTH sources live here — one row per
// (event, date, venue-or-venues) combination, already source-agnostic
// by the time render() touches it.
let allRows = [];
let sourceStatus = []; // [{name, updated, ok}] — for the footer, and so
                        // one source failing doesn't take down the other.

function todayKey(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function isRecentlyAnnounced(firstSeen){
  if(!firstSeen) return false;
  const seenDate = new Date(firstSeen + 'T00:00:00');
  const daysSince = (new Date() - seenDate) / (1000*60*60*24);
  return daysSince >= 0 && daysSince < NEW_WINDOW_DAYS;
}

// more.com: one event per JSON entry, a single ISO `start` datetime,
// venues as objects ({name, locality, ...}), genre tags present.
// more.com: one event per JSON entry, but EACH venue now carries its
// OWN start/end (fixed 28/8/2026 — a multi-city tour used to share one
// date across every city, which was wrong; now each venue/date pair is
// independent, and can independently be "attica" or "unconfirmed" via
// region_status, same flagging philosophy as ticketservices.gr).
function rowsFromMore(data){
  const rows = [];
  (data.events || []).forEach(ev => {
    (ev.venues || []).forEach(v => {
      rows.push({
        title: ev.title,
        url: ev.url,
        genres: ev.genres || [],
        genreApprox: false,
        source: ev.source || 'more.com',
        venueName: v.name,
        venueArea: v.locality || '',
        date: v.start ? v.start.slice(0,10) : '',
        time: v.start ? v.start.slice(11,16) : '',
        unconfirmedRegion: v.region_status === 'unconfirmed',
        firstSeen: ev.first_seen || '',
      });
    });
  });
  return rows;
}

// ticketservices.gr: one event per JSON entry, a LIST of dates and a
// LIST of venues that don't necessarily line up 1:1 (e.g. a 5-date
// event with only 2 distinct venues across the whole run) — no time-of-
// day is available at all, and no genre tags. One row per date, all
// venues for that event shown together rather than guessing a pairing.
// region_status "unconfirmed" (no area id on the original listing) is
// shown but flagged, not hidden and not silently trusted.
function rowsFromTicketservices(data){
  const rows = [];
  (data.events || []).forEach(ev => {
    const venueText = (ev.venues || []).join(' / ');
    (ev.dates || []).forEach(d => {
      rows.push({
        title: ev.title,
        url: ev.url,
        genres: [],
        genreApprox: false,
        source: ev.source || 'ticketservices.gr',
        venueName: venueText,
        venueArea: '',
        date: d,
        time: '',
        unconfirmedRegion: ev.region_status === 'unconfirmed',
        firstSeen: ev.first_seen || '',
      });
    });
  });
  return rows;
}

// rocking.gr: one event per JSON entry already (single date, single
// venue) — no genre field in the source data at all, and no
// Attica-filtering concept needed since the URL itself (/athens) already
// scopes it. rocking.gr is itself a rock/metal-focused webzine, though —
// looking at real scraped output, the large majority of what it lists
// IS rock/metal by the nature of the source, even with no per-event tag.
// Defaulting every rocking.gr event to a "rock" tag is therefore a
// reasonable rough guess, NOT confirmed data — the site does also cover
// some non-metal acts (Belle & Sebastian, Deep Purple, indie/classic
// rock, etc), so this will occasionally be wrong. genreApprox:true makes
// the frontend render it visibly differently from a real, source-
// confirmed genre tag (dashed outline + tooltip), rather than presenting
// a guess with the same confidence as more.com's actual genre data.
function rowsFromRocking(data){
  return (data.events || []).map(ev => ({
    title: ev.title,
    url: ev.url,
    genres: ['rock'],
    genreApprox: true,
    source: ev.source || 'rocking.gr',
    venueName: ev.venue || '',
    venueArea: '',
    date: ev.date || '',
    time: '',
    unconfirmedRegion: false,
    firstSeen: ev.first_seen || '',
  }));
}

// Best-effort match used ONLY to suppress rocking.gr duplicates of
// events already covered by more.com/ticketservices.gr — biased toward
// NOT suppressing when unsure (a missed duplicate is harmless, a
// wrongly-hidden real event is worse).
function normalizeText(v){
  return (v || '')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // strip accents (Greek + Latin)
    .toLowerCase()
    .replace(/[^\p{L}\p{N}]+/gu, ' ')
    .trim();
}

// Words too generic to count as a meaningful match on their own, in
// both languages this project deals with.
const STOPWORDS = new Set([
  'live', 'tour', 'festival', 'the', 'of', 'in', 'at', 'and', 'or',
  'ζωντανα', 'ζωντανη', 'συναυλια', 'και', 'του', 'της', 'στην', 'στο', 'με', 'kai',
]);

function significantWords(v){
  return normalizeText(v).split(' ').filter(w => w.length > 2 && !STOPWORDS.has(w));
}

function wordOverlapRatio(a, b){
  const wa = new Set(significantWords(a));
  const wb = new Set(significantWords(b));
  if(wa.size === 0 || wb.size === 0) return 0;
  let shared = 0;
  wa.forEach(w => { if(wb.has(w)) shared++; });
  return shared / Math.min(wa.size, wb.size);
}

// High-confidence on its own: one venue name fully contains the other,
// e.g. "Gagarin 205" vs "Gagarin 205 Live Music Space".
function strictVenueMatch(a, b){
  const na = normalizeText(a), nb = normalizeText(b);
  if(!na || !nb) return false;
  return na.includes(nb) || nb.includes(na);
}

// Looser signal: shares at least half the significant words of the
// smaller name. Catches e.g. "Κέντρο Πολιτισμού «Ελληνικός Κόσμος»" vs
// "Ελληνικός Κόσμος - ΘΕΑΤΡΟΝ (Αιθ. Αντιγόνη)" — same venue complex,
// different named hall inside it — but is NOT trusted alone (a big
// multi-hall venue hosting two unrelated shows the same night would
// also share this), only combined with title agreement below.
function looseVenueMatch(a, b){
  return wordOverlapRatio(a, b) >= 0.5;
}

function isDuplicate(row, primaryRows){
  return primaryRows.some(p => {
    if(p.date !== row.date) return false;
    if(strictVenueMatch(p.venueName, row.venueName)) return true;
    return looseVenueMatch(p.venueName, row.venueName)
        && wordOverlapRatio(p.title, row.title) >= 0.4;
  });
}

async function loadSource(url, normalizeFn, label){
  try{
    const res = await fetch(url, {cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    sourceStatus.push({name: label, updated: data.updated || '', ok: true});
    return normalizeFn(data);
  }catch(err){
    sourceStatus.push({name: label, updated: '', ok: false, error: err.message});
    return [];
  }
}

async function load(){
  const [moreRows, tsRows, rockingRowsRaw] = await Promise.all([
    loadSource('data/music_more.json', rowsFromMore, 'more.com'),
    loadSource('data/music_ticketservices.json', rowsFromTicketservices, 'ticketservices.gr'),
    loadSource('data/music_rocking.json', rowsFromRocking, 'rocking.gr'),
  ]);

  // rocking.gr isn't a ticket vendor — it's a discovery source. If
  // more.com or ticketservices.gr already has a given (date, venue),
  // treat rocking.gr's copy of that same show as a duplicate and drop
  // it, so rocking.gr only ever ADDS events the other two don't have
  // (its main value: catching shows outside more.com/ticketservices.gr,
  // e.g. things that would otherwise only ever show up via
  // ticketmaster.gr, which isn't scraped).
  const primaryRows = [...moreRows, ...tsRows];
  const rockingRows = rockingRowsRaw.filter(r => !isDuplicate(r, primaryRows));

  allRows = [...moreRows, ...tsRows, ...rockingRows];

  if(allRows.length === 0 && sourceStatus.every(s => !s.ok)){
    document.getElementById('results').innerHTML =
      '<div class="state">Δεν ήταν δυνατή η φόρτωση των δεδομένων.</div>';
    return;
  }
  init();
}

function init(){
  document.getElementById('search').addEventListener('input', render);

  const footerParts = sourceStatus.map(s =>
    s.ok ? `${s.name} (${s.updated || '—'})` : `${s.name} μη διαθέσιμο`
  );
  document.getElementById('footer').textContent =
    'Δεδομένα από: ' + footerParts.join(' · ');

  render();
}

function render(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const results = document.getElementById('results');
  results.innerHTML = '';

  const today = todayKey();

  // Keep only today-or-later, sort chronologically (date first, then time
  // — rows with no time, i.e. ticketservices.gr, sort before timed ones
  // on the same day, which is an acceptable ambiguity given the source
  // genuinely doesn't provide a time).
  let rows = allRows.filter(r => r.date && r.date >= today);
  rows.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time));

  if(q){
    rows = rows.filter(r => {
      const blob = (r.title + ' ' + r.venueName + ' ' + r.genres.join(' ')).toLowerCase();
      return blob.includes(q);
    });
  }

  let lastMonthKey = null;
  rows.forEach(r => {
    const dt = new Date(r.date + 'T00:00:00');
    const monthKey = `${dt.getFullYear()}-${dt.getMonth()}`;
    if(monthKey !== lastMonthKey){
      const h = document.createElement('div');
      h.className = 'month-header';
      h.textContent = `${MONTHS[dt.getMonth()]} ${dt.getFullYear()}`;
      results.appendChild(h);
      lastMonthKey = monthKey;
    }

    const div = document.createElement('div');
    div.className = 'event';
    div.innerHTML = `
      <div class="e-top">
        <div>
          <h3 class="e-title">${r.title}</h3>
          <div class="e-venue">${r.venueName}${r.venueArea ? ' · '+r.venueArea : ''}${r.time ? ' · '+r.time : ''}</div>
        </div>
        <div class="e-date">${dt.getDate()}</div>
      </div>
      ${r.genres.length ? `<div class="e-genres">${r.genres.map(g=>
        r.genreApprox
          ? `<span class="genre-tag-approx" title="Κατά προσέγγιση — η πηγή (rocking.gr) δεν δηλώνει είδος, υποθέτουμε με βάση τον χαρακτήρα του site">${g} ?</span>`
          : `<span class="genre-tag">${g}</span>`
      ).join('')}</div>` : ''}
      ${isRecentlyAnnounced(r.firstSeen) ? `<div class="e-new">Νέο</div>` : ''}
      ${r.unconfirmedRegion ? `<div class="e-unconfirmed">Περιοχή μη επιβεβαιωμένη</div>` : ''}
      <div class="e-source"><a href="${r.url}" target="_blank">${r.source}</a></div>
    `;
    results.appendChild(div);
  });

  if(rows.length === 0){
    results.innerHTML = '<div class="state">Καμία συναυλία δεν βρέθηκε' + (q ? ' με αυτά τα κριτήρια' : '') + '.</div>';
  }

  document.getElementById('count').textContent = rows.length + ' συναυλίες' + (q ? ' · φίλτρο "'+q+'"' : '');
}

load();
</script>
</body>
</html>

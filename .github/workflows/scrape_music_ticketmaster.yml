name: Scrape music listings (ticketmaster.gr)

on:
  schedule:
    # Same cadence as the more.com music scraper — new events can be
    # listed any day, not tied to a weekly cycle.
    - cron: "20 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-music-ticketmaster
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright (this scraper only)
        # Kept out of the shared requirements.txt on purpose — the
        # cinema and more.com scrapers don't need a real browser and
        # would otherwise install this unnecessarily on every run too.
        # requests kept getting a 403 from ticketmaster.gr even with a
        # full browser-like header set (confirmed 28/8/2026); the fix is
        # driving a real Chromium browser instead. `--with-deps` also
        # installs the OS-level libraries Chromium needs to run on the
        # bare ubuntu-latest image.
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run ticketmaster.gr music scraper
        run: python scripts/scrape_music_ticketmaster.py

      - name: Commit updated data
        run: |
          git config user.name "athens-tonight-bot"
          git config user.email "actions@github.com"
          git add data/music_ticketmaster.json
          git diff --quiet --cached || git commit -m "Update ticketmaster.gr music listings"
          git pull --rebase origin main
          git push
